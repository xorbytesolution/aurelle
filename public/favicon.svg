<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141311"/>
      <stop offset="60%" stop-color="#080807"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>

    <!-- 24K Polished Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d8"/>
      <stop offset="25%" stop-color="#dfb776"/>
      <stop offset="50%" stop-color="#9a722c"/>
      <stop offset="75%" stop-color="#f5e3ba"/>
      <stop offset="100%" stop-color="#7a581e"/>
    </linearGradient>

    <!-- Left Leg Gold Highlight -->
    <linearGradient id="goldStemLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9ec"/>
      <stop offset="35%" stop-color="#f0d59e"/>
      <stop offset="70%" stop-color="#cf9f52"/>
      <stop offset="100%" stop-color="#8a6320"/>
    </linearGradient>

    <!-- Right Leg Gold Shadow & Luster -->
    <linearGradient id="goldStemRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edd298"/>
      <stop offset="40%" stop-color="#c89a4b"/>
      <stop offset="80%" stop-color="#916723"/>
      <stop offset="100%" stop-color="#5a3d0f"/>
    </linearGradient>

    <!-- Crossbar Gold Bar -->
    <linearGradient id="goldCrossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c99d50"/>
      <stop offset="50%" stop-color="#fff5dc"/>
      <stop offset="100%" stop-color="#a87c32"/>
    </linearGradient>

    <!-- Diamond Brilliant Facet Highlights -->
    <linearGradient id="diamondTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6ebfa"/>
    </linearGradient>
    <linearGradient id="diamondSideL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf4fd"/>
      <stop offset="100%" stop-color="#9ac4e8"/>
    </linearGradient>
    <linearGradient id="diamondSideR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8daf5"/>
    </linearGradient>
    <linearGradient id="diamondGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd580"/>
    </linearGradient>

    <!-- Sparkle Flare Filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle with Gold Border -->
  <rect x="18" y="18" width="476" height="476" rx="124" fill="url(#bgGrad)"/>
  <rect x="18" y="18" width="476" height="476" rx="124" fill="none" stroke="url(#goldRim)" stroke-width="5"/>
  <rect x="28" y="28" width="456" height="456" rx="114" fill="none" stroke="rgba(224, 189, 117, 0.2)" stroke-width="1.5"/>

  <!-- Soft Ambient Gold Radiance under Diamond -->
  <circle cx="256" cy="180" r="130" fill="#e8c47e" opacity="0.09" filter="url(#glow)"/>

  <!-- ================================================================= -->
  <!-- AURELLE MONOGRAM "A" (Sculpted Luxury Roman Geometry) -->
  <!-- ================================================================= -->

  <!-- Left Stem (Beveled Highlight) -->
  <polygon points="256,96 232,96 112,392 152,392 178,324 256,324" fill="url(#goldStemLeft)"/>

  <!-- Right Stem (Beveled Deep Gold) -->
  <polygon points="256,96 280,96 400,392 360,392 334,324 256,324" fill="url(#goldStemRight)"/>

  <!-- Inner Triangular Cutout (Gives the architectural letterform depth) -->
  <polygon points="256,168 194,310 318,310" fill="#080807"/>

  <!-- Horizontal Architectural Bridge (Crossbar with Beveled Gold Plate) -->
  <polygon points="186,306 326,306 336,330 176,330" fill="url(#goldCrossbar)"/>
  <polygon points="188,308 324,308 327,314 185,314" fill="#fffbe8" opacity="0.8"/>

  <!-- Left Base Serif -->
  <polygon points="96,400 166,400 160,386 118,386 112,392 96,400" fill="url(#goldStemLeft)"/>
  <rect x="96" y="394" width="70" height="6" rx="1.5" fill="url(#goldRim)"/>

  <!-- Right Base Serif -->
  <polygon points="346,400 416,400 400,386 352,386 346,400" fill="url(#goldStemRight)"/>
  <rect x="346" y="394" width="70" height="6" rx="1.5" fill="url(#goldRim)"/>

  <!-- ================================================================= -->
  <!-- THE SOLITAIRE CROWN: Brilliant Diamond Jewel at the Apex -->
  <!-- ================================================================= -->
  <!-- Pavilion & Girdle Base Mount -->
  <polygon points="256,76 216,146 296,146" fill="#1b2430" stroke="url(#goldRim)" stroke-width="2"/>

  <!-- Main Table Facet (Brilliant Pure White) -->
  <polygon points="238,98 274,98 288,126 224,126" fill="url(#diamondTop)"/>

  <!-- Upper Crown Facets (Prismatic Refraction) -->
  <polygon points="256,76 238,98 274,98" fill="#ffffff"/>
  <polygon points="256,76 216,146 224,126 238,98" fill="url(#diamondSideL)"/>
  <polygon points="256,76 296,146 288,126 274,98" fill="url(#diamondSideR)"/>

  <!-- Lower Pavilion Triangular Facets -->
  <polygon points="224,126 288,126 256,166" fill="#f0f7ff" stroke="rgba(255,255,255,0.7)" stroke-width="1"/>
  <polygon points="216,146 224,126 256,166" fill="#b4daf8"/>
  <polygon points="296,146 288,126 256,166" fill="#cbe7ff"/>

  <!-- Prongs Holding the Solitaire (18K White Gold Beads) -->
  <circle cx="216" cy="146" r="4.5" fill="#ffffff" stroke="#c89a4b" stroke-width="1.5"/>
  <circle cx="296" cy="146" r="4.5" fill="#ffffff" stroke="#c89a4b" stroke-width="1.5"/>
  <circle cx="256" cy="74" r="4.5" fill="#ffffff" stroke="#c89a4b" stroke-width="1.5"/>

  <!-- ================================================================= -->
  <!-- CELESTIAL 4-POINT BRILLIANT SCINTILLATION STAR (Top-Right Sparkle) -->
  <!-- ================================================================= -->
  <g transform="translate(308, 76)" filter="url(#glow)">
    <!-- Aura Halo -->
    <circle cx="0" cy="0" r="16" fill="#fdeec6" opacity="0.65"/>
    <!-- Vertical Spike -->
    <path d="M 0 -38 Q 0 0 10 0 Q 0 0 0 38 Q 0 0 -10 0 Q 0 0 0 -38 Z" fill="url(#diamondGlint)"/>
    <!-- Horizontal Spike -->
    <path d="M -38 0 Q 0 0 0 10 Q 0 0 38 0 Q 0 0 0 -10 Q 0 0 -38 0 Z" fill="url(#diamondGlint)"/>
    <!-- Diagonal Subtle Glints -->
    <path d="M -14 -14 Q 0 0 14 14 Q 0 0 -14 -14 Z" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 14 -14 Q 0 0 -14 14 Q 0 0 14 -14 Z" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Core Bright Diamond Node -->
    <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Tiny Secondary Sparkle at Base of Solitaire -->
  <g transform="translate(204, 154)">
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" filter="url(#glow)"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="1.5"/>
  </g>
</svg>